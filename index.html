<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Asistencia - EEP</title>
    <meta
      name="description"
      content="Registro de asistencia de la red de sucursales EEP. Instálala en tu teléfono como una app."
    />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/adp.png" />
    <link rel="apple-touch-icon" href="icons/adp.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EEP" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <script src="install-banner.js" defer></script>
    <style>
      :root {
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-color: #1e293b;
        --border-color: #cbd5e1;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 500px;
        margin: 0 auto;
        background: var(--card-bg);
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }
      h2 {
        margin-top: 0;
        color: var(--primary-color);
        text-align: center;
        font-size: 1.4rem;
        margin-bottom: 5px;
      }
      .subtitle {
        text-align: center;
        font-size: 0.85rem;
        color: #64748b;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
        font-size: 0.9rem;
      }
      input,
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 0.95rem;
        box-sizing: border-box;
        background-color: #fff;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--primary-color);
      }
      input:disabled,
      select:disabled {
        background-color: #f1f5f9;
        color: #94a3b8;
        cursor: not-allowed;
      }
      /* Turno y cargo ya guardados en la hoja Personal: se muestran fijos */
      select.locked:disabled {
        background-color: #ecfdf5;
        color: #047857;
        font-weight: 700;
        cursor: default;
        opacity: 1;
        -webkit-text-fill-color: #047857;
      }
      label.locked-label {
        color: #047857;
      }
      .hint {
        margin: 6px 0 0 0;
        font-size: 0.8rem;
        font-weight: 500;
        color: #64748b;
      }
      .activities-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .activity-checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #f8fafc;
        border: 1px solid var(--border-color);
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        font-size: 0.9rem;
        margin-bottom: 0;
      }
      .activity-checkbox input {
        width: auto;
        margin: 0;
        cursor: pointer;
        accent-color: var(--primary-color);
      }
      .activity-checkbox:hover {
        border-color: var(--primary-color);
      }
      .activity-checkbox:has(input:checked) {
        background: #eff6ff;
        border-color: var(--primary-color);
        color: var(--primary-hover);
        font-weight: 600;
      }
      .activity-checkbox.libre {
        background-color: #fef3c7;
        border-color: #f59e0b;
      }
      .activity-checkbox.libre:hover {
        border-color: #f59e0b;
      }
      .activity-checkbox.libre:has(input:checked) {
        background-color: #fde68a;
        border-color: #f59e0b;
        color: #92400e;
      }
      .manual-name-toggle {
        margin-top: 8px;
        font-weight: 500;
        font-size: 0.85rem;
      }
      #fullNameManual {
        margin-top: 8px;
      }
      .btn-submit {
        background-color: var(--primary-color);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
        font-size: 1rem;
        margin-top: 10px;
      }
      .btn-submit:hover {
        background-color: var(--primary-hover);
      }
      .success-msg {
        color: #16a34a;
        font-weight: 600;
        font-size: 0.9rem;
        margin-top: 15px;
        text-align: center;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Registro Diario de Personal</h2>
      <div class="subtitle">Red de Sucursales EEP</div>

      <form id="workerForm">
        <div class="form-group">
          <label for="date">Fecha:</label>
          <input type="date" id="date" required />
        </div>

        <div class="form-group">
          <label for="storeName">Sucursal:</label>
          <select id="storeName" required>
            <option value="" disabled selected>
              Selecciona tu sucursal...
            </option>
            <option value="EEP el paraiso">EEP el paraiso</option>
            <option value="LIN la india">LIN la india</option>
            <!-- Agrega aquí el resto de tus 47 sucursales -->
          </select>
        </div>

        <div class="form-group">
          <label for="fullName">Nombre y Apellido:</label>
          <select id="fullName" required disabled>
            <option value="">Selecciona primero tu sucursal...</option>
          </select>
          <label class="activity-checkbox manual-name-toggle">
            <input type="checkbox" id="manualNameToggle" /> No estoy en la lista,
            escribir mi nombre
          </label>
          <input
            type="text"
            id="fullNameManual"
            placeholder="Ej. Carlos Pérez"
            autocomplete="off"
            hidden
          />
          <p class="hint" id="rosterHint">
            Elige la sucursal para ver su personal.
          </p>
        </div>

        <div class="form-group">
          <label for="workerShift">Turno:</label>
          <select id="workerShift" required disabled>
            <option value="AM">AM (6:30 AM - 3:30 PM)</option>
            <option value="PM">PM (12:30 PM - 9:30 PM)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="workerRole">Cargo:</label>
          <select id="workerRole" required disabled>
            <option value="multifuncional">Multifuncional</option>
            <option value="supervisor">Supervisor</option>
          </select>
        </div>

        <div class="form-group">
          <label>Estado / Actividad realizada:</label>
          <div class="activities-grid">
            <label class="activity-checkbox"
              ><input type="checkbox" name="act" value="caja" /> Caja</label
            >
            <label class="activity-checkbox"
              ><input type="checkbox" name="act" value="pasillo" /> Pasillo</label
            >
            <label class="activity-checkbox"
              ><input type="checkbox" name="act" value="almacen" /> Almacén</label
            >
            <label class="activity-checkbox"
              ><input type="checkbox" name="act" value="gourmet" /> Gourmet</label
            >
            <label class="activity-checkbox"
              ><input type="checkbox" name="act" value="autopago" /> Autopago</label
            >
            <label class="activity-checkbox"
              ><input type="checkbox" name="act" value="procamp" /> Procamp</label
            >
            <label class="activity-checkbox"
              ><input type="checkbox" name="act" value="perecedero" /> Perecedero</label
            >
            <label class="activity-checkbox libre"
              ><input type="checkbox" name="act" value="libre" /> Libre (día
              libre)</label
            >
          </div>
          <p class="hint">
            Marca varias actividades si hiciste más de una. "Libre" es
            exclusivo.
          </p>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          Enviar mi Reporte
        </button>
        <div id="successMsg" class="success-msg">
          ¡Reporte enviado con éxito a la nube!
        </div>
      </form>
    </div>

    <script>
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbzFJlIBwgVUItJUcVDJlKz4Nluh2FrCO402-02LhytOjho8y7UA7Saj1hQp51JFpQs/exec";

      // Padrón base inicial por sucursal
      let SUCURSALES = {
        "EEP el paraiso": [
          { nombre: "Joberland Suniaga", turno: "PM", cargo: "supervisor" },
        ],
        "LIN la india": [
          { nombre: "Alejandro Delgado", turno: "AM", cargo: "supervisor" },
        ],
      };

      const storeNameEl = document.getElementById("storeName");
      const fullNameEl = document.getElementById("fullName");
      const fullNameManualEl = document.getElementById("fullNameManual");
      const manualToggleEl = document.getElementById("manualNameToggle");
      const rosterHintEl = document.getElementById("rosterHint");
      const shiftEl = document.getElementById("workerShift");
      const roleEl = document.getElementById("workerRole");
      const shiftLabelEl = document.querySelector('label[for="workerShift"]');
      const roleLabelEl = document.querySelector('label[for="workerRole"]');

      // Texto original de las etiquetas, para poder quitar el aviso de bloqueo
      shiftLabelEl.dataset.base = shiftLabelEl.textContent.trim();
      roleLabelEl.dataset.base = roleLabelEl.textContent.trim();

      // Padrón de la pestaña "Personal" de Google Sheets (Nombre, Turno, Cargo,
      // Sucursal). Quien no esté ahí se agrega con la casilla de escribir el
      // nombre a mano.
      let PERSONAL = [];

      // valueAsDate guarda la fecha en UTC, por lo que de noche registraba el
      // reporte con el día siguiente.
      function todayISO() {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
      }

      document.getElementById("date").value = todayISO();

      // Sincroniza y extrae el personal registrado desde el Google Sheet (reports y workers)
      async function fetchRegisteredWorkers() {
        try {
          const response = await fetch(SCRIPT_URL);
          const data = await response.json();
          
          PERSONAL = normalizarPersonal(data.personal || data.workers || []);

          const reportsList = data.reports || (Array.isArray(data) ? data : []);
          
          reportsList.forEach(row => {
            const tienda = String(row.storeName || "").trim();
            const nombre = String(row.fullName || "").trim();
            const turno = String(row.workerShift || "AM").trim().toUpperCase();
            const cargo = String(row.workerRole || "multifuncional").trim().toLowerCase();

            if (tienda && nombre) {
              let keyFound = Object.keys(SUCURSALES).find(k => k.toLowerCase() === tienda.toLowerCase());
              if (!keyFound) {
                SUCURSALES[tienda] = [];
                keyFound = tienda;
                
                if (!Array.from(storeNameEl.options).some(opt => opt.value.toLowerCase() === tienda.toLowerCase())) {
                  addOption(storeNameEl, tienda, tienda);
                }
              }

              const existe = SUCURSALES[keyFound].some(w => w.nombre.toLowerCase() === nombre.toLowerCase());
              if (!existe) {
                SUCURSALES[keyFound].push({ nombre: nombre, turno: turno, cargo: cargo });
              }
            }
          });

          renderWorkersByStore();
        } catch (error) {
          console.error("No se pudo sincronizar el personal histórico:", error);
          renderWorkersByStore();
        }
      }

      // Acepta objetos (nombre/turno/cargo/sucursal) o textos sueltos, que es
      // como el script devolvia el padron antes de la actualizacion
      function normalizarPersonal(lista) {
        if (!Array.isArray(lista)) return [];

        const vistos = new Set();

        return lista
          .map((item) => {
            if (typeof item === "string") {
              return { nombre: item.trim(), turno: "", cargo: "", sucursal: "" };
            }
            const campos = normalizarCampos(item);
            const nombre = buscarCampo(
              campos,
              ["nombre", "fullname", "name", "trabajador", "empleado"],
              ["nombre", "apellido", "empleado", "trabajador"]
            );
            if (!nombre) return null;

            return {
              nombre,
              turno: buscarCampo(
                campos,
                ["turno", "workershift", "shift"],
                ["turno", "shift"]
              ).toUpperCase(),
              cargo: buscarCampo(
                campos,
                ["cargo", "workerrole", "role", "puesto"],
                ["cargo", "puesto", "role"]
              ).toLowerCase(),
              sucursal: buscarCampo(
                campos,
                ["sucursal", "storename", "store", "tienda"],
                ["sucursal", "tienda", "store"]
              ),
            };
          })
          .filter(Boolean)
          .filter((p) => {
            const clave = claveNombre(p.nombre);
            if (vistos.has(clave)) return false;
            vistos.add(clave);
            return true;
          })
          .sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
      }

      // Los encabezados llegan como "Nombre", "Nombre y Apellido" o
      // "workerShift": se comparan sin espacios, sin mayusculas ni tildes
      function normalizarCampos(fila) {
        const campos = {};
        if (!fila || typeof fila !== "object") return campos;

        for (const clave of Object.keys(fila)) {
          const limpio = String(clave)
            .trim()
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[\s_-]/g, "");
          campos[limpio] = fila[clave];
        }

        return campos;
      }

      // Compara nombres sin tildes, mayusculas ni espacios de mas, para que
      // "Ana  Ruiz" en la hoja no cargue dos veces el mismo nombre
      function claveNombre(nombre) {
        return String(nombre || "")
          .trim()
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/\s+/g, " ");
      }

      // "EEP el paraiso" en la hoja y "EEP" en el formulario son la misma
      // sucursal, asi que se comparan los dos textos
      function mismaSucursal(a, b) {
        const x = claveNombre(a);
        const y = claveNombre(b);
        if (!x || !y) return false;
        return x === y || x.includes(y) || y.includes(x);
      }

      function primerTexto(campos, claves) {
        for (const clave of claves) {
          const valor = String(campos[clave] === undefined ? "" : campos[clave]).trim();
          if (valor) return valor;
        }
        return "";
      }

      // Busca el encabezado exacto y, si no aparece, uno que empiece igual:
      // "Nombre y Apellido" o "Turno habitual" tambien sirven
      function buscarCampo(campos, exactas, prefijos) {
        const directo = primerTexto(campos, exactas);
        if (directo) return directo;

        for (const clave of Object.keys(campos)) {
          if (!prefijos.some((p) => clave.indexOf(p) === 0)) continue;

          const valor = String(campos[clave] === undefined ? "" : campos[clave]).trim();
          if (valor) return valor;
        }

        return "";
      }

      function findSucursalKey(value) {
        const target = String(value || "").trim().toLowerCase();
        if (!target) return null;
        return Object.keys(SUCURSALES).find(key => key.trim().toLowerCase() === target) || null;
      }

      // Solo se muestra el personal de la sucursal elegida: lo que viene en la
      // hoja Personal mas los que ya reportaron alli. Quien esta en la hoja sin
      // sucursal asignada aparece en todas, para que no quede fuera de la lista.
      function storeWorkers() {
        const key = findSucursalKey(storeNameEl.value);
        const historico = key ? SUCURSALES[key] : [];
        const lista = [];
        const agregados = new Set();
        // Quien ya esta en la hoja Personal tiene turno y cargodecidedos
        const registrados = new Set(PERSONAL.map((p) => claveNombre(p.nombre)));

        historico.forEach((w) => {
          const nombre = String(w.nombre || "").trim();
          if (!nombre) return;

          agregados.add(claveNombre(nombre));
          lista.push({
            fullName: nombre,
            workerShift: String(w.turno || "").trim().toUpperCase(),
            workerRole: String(w.cargo || "").trim().toLowerCase(),
            registrado: registrados.has(claveNombre(nombre)),
          });
        });

        PERSONAL.forEach((p) => {
          if (agregados.has(claveNombre(p.nombre))) return;
          if (p.sucursal && !mismaSucursal(p.sucursal, storeNameEl.value)) return;

          agregados.add(claveNombre(p.nombre));
          lista.push({
            fullName: p.nombre,
            workerShift: String(p.turno || "").trim().toUpperCase(),
            workerRole: String(p.cargo || "").trim().toLowerCase(),
            // Quien esta en la hoja Personal ya tiene turno y cargo decididos:
            // despues no se pueden cambiar desde el formulario
            registrado: true,
          });
        });

        return lista;
      }

      function addOption(select, value, text) {
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = text;
        select.appendChild(opt);
      }

      function renderWorkersByStore() {
        liberarCampo(shiftEl, shiftLabelEl);
        liberarCampo(roleEl, roleLabelEl);
        shiftLabelEl.classList.remove("locked-label");
        roleLabelEl.classList.remove("locked-label");

        if (manualToggleEl.checked) {
          fullNameEl.innerHTML = "";
          fullNameEl.hidden = true;
          fullNameEl.disabled = true;
          fullNameEl.required = false;
          fullNameManualEl.hidden = false;
          fullNameManualEl.required = true;
          rosterHintEl.textContent = "Escribe tu nombre y apellido.";
          return;
        }

        fullNameManualEl.hidden = true;
        fullNameManualEl.required = false;
        fullNameEl.hidden = false;
        fullNameEl.innerHTML = "";
        shiftEl.disabled = true;
        roleEl.disabled = true;

        const store = storeNameEl.value;

        if (!store) {
          addOption(fullNameEl, "", "Selecciona primero tu sucursal...");
          fullNameEl.disabled = true;
          rosterHintEl.textContent = "Elige la sucursal para ver su personal.";
          return;
        }

        const list = storeWorkers();

        if (list.length === 0) {
          addOption(fullNameEl, "", "No hay personal registrado en esta sucursal aún");
          fullNameEl.disabled = true;
          rosterHintEl.textContent = "Marca la casilla de abajo para escribir tu nombre por primera vez.";
          return;
        }

        addOption(fullNameEl, "", "Selecciona tu nombre...");
        list.forEach((w) => addOption(fullNameEl, w.fullName, w.fullName));
        fullNameEl.disabled = false;

        const deLaSucursal = SUCURSALES[findSucursalKey(store) || ""] || [];
        const sinSucursal = PERSONAL.filter((p) => !p.sucursal).length;
        let hint = list.length === 1
          ? "1 trabajador en esta sucursal."
          : list.length + " trabajadores en esta sucursal.";
        if (sinSucursal > 0 && deLaSucursal.length > 0) {
          hint += " " + sinSucursal + " sin sucursal en la hoja, se muestran igual.";
        }
        rosterHintEl.textContent = hint;
      }

      // Marca un campo como bloqueado: se muestra el valor guardado en la hoja
      // Personal y ya no se puede cambiar desde el formulario
      function bloquearCampo(select, etiqueta) {
        select.disabled = true;
        select.classList.add("locked");
        select.setAttribute("aria-readonly", "true");
        etiqueta.textContent = etiqueta.dataset.base + " (no se modifica)";
      }

      function liberarCampo(select, etiqueta) {
        select.disabled = false;
        select.classList.remove("locked");
        select.removeAttribute("aria-readonly");
        etiqueta.textContent = etiqueta.dataset.base;
      }

      function autofillWorkerData() {
        liberarCampo(shiftEl, shiftLabelEl);
        liberarCampo(roleEl, roleLabelEl);

        const worker = storeWorkers().find((w) => w.fullName === fullNameEl.value);
        if (!worker) return;

        if (worker.workerShift === "AM" || worker.workerShift === "PM") {
          shiftEl.value = worker.workerShift;
        }
        if (["supervisor", "multifuncional"].includes(worker.workerRole)) {
          roleEl.value = worker.workerRole;
        }

        // Ya esta en la hoja Personal con ese dato: se deja fijo
        if (worker.registrado) {
          if (worker.workerShift === "AM" || worker.workerShift === "PM") {
            bloquearCampo(shiftEl, shiftLabelEl);
          }
          if (["supervisor", "multifuncional"].includes(worker.workerRole)) {
            bloquearCampo(roleEl, roleLabelEl);
          }
        }
      }

      storeNameEl.addEventListener("change", renderWorkersByStore);
      fullNameEl.addEventListener("change", autofillWorkerData);
      manualToggleEl.addEventListener("change", renderWorkersByStore);
      
      // Llamada para cargar los datos desde Google Sheets al abrir la página
      fetchRegisteredWorkers();

      // "Libre" no se combina con actividades
      const LIBRE_VALUE = "libre";
      const activityBoxes = Array.from(document.querySelectorAll('input[name="act"]'));

      activityBoxes.forEach((box) => {
        box.addEventListener("change", () => {
          if (!box.checked) return;
          activityBoxes.forEach((other) => {
            if (other === box) return;
            if (box.value === LIBRE_VALUE || other.value === LIBRE_VALUE) {
              other.checked = false;
            }
          });
        });
      });

      document.getElementById("workerForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const fullName = (manualToggleEl.checked ? fullNameManualEl.value : fullNameEl.value).trim();
        const selectedActivities = Array.from(document.querySelectorAll('input[name="act"]:checked')).map((cb) => cb.value);

        if (!fullName) {
          alert("Selecciona tu nombre o escribe el tuyo manualmente.");
          return;
        }
        if (selectedActivities.length === 0) {
          alert("Selecciona al menos una actividad realizada.");
          return;
        }

        const btn = document.getElementById("submitBtn");
        btn.textContent = "Enviando...";
        btn.disabled = true;

        // Se guardan antes de limpiar el formulario, para no leer los valores
        // por defecto del reseteo
        const tiendaActual = storeNameEl.value;
        const turnoElegido = shiftEl.value;
        const cargoElegido = roleEl.value;

        const formData = {
          date: document.getElementById("date").value,
          storeName: storeNameEl.value,
          fullName: fullName,
          workerShift: shiftEl.value,
          workerRole: roleEl.value,
          attendanceStatus: selectedActivities.join(", "),
        };

        try {
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData),
          });

          document.getElementById("successMsg").style.display = "block";
          document.getElementById("workerForm").reset();
          document.getElementById("date").value = todayISO();
          
          // El nombre ya quedo guardado en la hoja Personal, asi que turno y
          // cargo quedan fijos de inmediato, sin esperar a recargar
          if (!PERSONAL.some((p) => claveNombre(p.nombre) === claveNombre(fullName))) {
            PERSONAL.push({
              nombre: fullName,
              turno: turnoElegido,
              cargo: cargoElegido,
              sucursal: tiendaActual,
            });
          }

          manualToggleEl.checked = false;
          renderWorkersByStore();

          setTimeout(() => {
            document.getElementById("successMsg").style.display = "none";
          }, 4000);
        } catch (error) {
          console.error(error);
          alert("Hubo un error al enviar el reporte. Verifica tu conexión.");
        } finally {
          btn.textContent = "Enviar mi Reporte";
          btn.disabled = false;
        }
      });
    </script>

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
