<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Asistencia - EEP</title>
    <style>
      :root {
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-color: #1e293b;
        --border-color: #cbd5e1;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 500px;
        margin: 0 auto;
        background: var(--card-bg);
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }
      h2 {
        margin-top: 0;
        color: var(--primary-color);
        text-align: center;
        font-size: 1.4rem;
        margin-bottom: 5px;
      }
      .subtitle {
        text-align: center;
        font-size: 0.85rem;
        color: #64748b;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
        font-size: 0.9rem;
      }
      input,
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 0.95rem;
        box-sizing: border-box;
        background-color: #fff;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--primary-color);
      }
      input:disabled,
      select:disabled {
        background-color: #f1f5f9;
        color: #94a3b8;
        cursor: not-allowed;
      }
      .hint {
        margin: 6px 0 0 0;
        font-size: 0.8rem;
        font-weight: 500;
        color: #64748b;
      }
      .activities-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .activity-checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #f8fafc;
        border: 1px solid var(--border-color);
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        font-size: 0.9rem;
        margin-bottom: 0;
      }
      .activity-checkbox input {
        width: auto;
        margin: 0;
        cursor: pointer;
        accent-color: var(--primary-color);
      }
      .activity-checkbox:hover {
        border-color: var(--primary-color);
      }
      .activity-checkbox:has(input:checked) {
        background: #eff6ff;
        border-color: var(--primary-color);
        color: var(--primary-hover);
        font-weight: 600;
      }
      .activity-checkbox.libre {
        grid-column: span 2;
        background-color: #fef3c7;
        border-color: #f59e0b;
      }
      .activity-checkbox.libre:hover {
        border-color: #f59e0b;
      }
      .activity-checkbox.libre:has(input:checked) {
        background-color: #fde68a;
        border-color: #f59e0b;
        color: #92400e;
      }
      .manual-name-toggle {
        margin-top: 8px;
        font-weight: 500;
        font-size: 0.85rem;
      }
      #fullNameManual {
        margin-top: 8px;
      }
      .btn-submit {
        background-color: var(--primary-color);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
        font-size: 1rem;
        margin-top: 10px;
      }
      .btn-submit:hover {
        background-color: var(--primary-hover);
      }
      .success-msg {
        color: #16a34a;
        font-weight: 600;
        font-size: 0.9rem;
        margin-top: 15px;
        text-align: center;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Registro Diario de Personal</h2>
      <div class="subtitle">Red de Sucursales EEP</div>

      <form id="workerForm">
        <div class="form-group">
          <label for="date">Fecha:</label>
          <input type="date" id="date" required />
        </div>

        <div class="form-group">
          <label for="storeName">Sucursal:</label>
          <select id="storeName" required>
            <option value="" disabled selected>
              Selecciona tu sucursal...
            </option>
            <option value="EEP el paraiso">EEP</option>
            <option value="LIN la india">LIN</option>
            <!-- Agrega aquí el resto de tus 47 sucursales -->
          </select>
        </div>

        <div class="form-group">
          <label for="fullName">Nombre y Apellido:</label>
          <select id="fullName" required disabled>
            <option value="">Selecciona primero tu sucursal...</option>
          </select>
          <label class="activity-checkbox manual-name-toggle">
            <input type="checkbox" id="manualNameToggle" /> No estoy en la lista,
            escribir mi nombre
          </label>
          <input
            type="text"
            id="fullNameManual"
            placeholder="Ej. Carlos Pérez"
            autocomplete="off"
            hidden
          />
          <p class="hint" id="rosterHint">
            Elige la sucursal para ver su personal.
          </p>
        </div>

        <div class="form-group">
          <label for="workerShift">Turno:</label>
          <select id="workerShift" required disabled>
            <option value="AM">AM (6:30 AM - 3:30 PM)</option>
            <option value="PM">PM (12:30 PM - 9:30 PM)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="workerRole">Cargo:</label>
          <select id="workerRole" required disabled>
            <option value="multifuncional">Multifuncional</option>
            <option value="supervisor">Supervisor</option>
          </select>
        </div>

        <div class="form-group">
          <label>Estado / Actividad realizada:</label>
          <div class="activities-grid">
            <label class="activity-checkbox"
              ><input type="checkbox" name="act" value="caja" /> Caja</label
            >
            <label class="activity-checkbox"
              ><input type="checkbox" name="act" value="pasillo" /> Pasillo</label
            >
            <label class="activity-checkbox"
              ><input type="checkbox" name="act" value="almacen" /> Almacén</label
            >
            <label class="activity-checkbox"
              ><input type="checkbox" name="act" value="gourmet" /> Gourmet</label
            >
            <label class="activity-checkbox"
              ><input type="checkbox" name="act" value="autopago" /> Autopago</label
            >
            <label class="activity-checkbox"
              ><input type="checkbox" name="act" value="procamp" /> Procamp</label
            >
            <label class="activity-checkbox libre"
              ><input type="checkbox" name="act" value="libre" /> Libre (día
              libre)</label
            >
          </div>
          <p class="hint">
            Marca varias actividades si hiciste más de una. "Libre" es
            exclusivo.
          </p>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          Enviar mi Reporte
        </button>
        <div id="successMsg" class="success-msg">
          ¡Reporte enviado con éxito a la nube!
        </div>
      </form>
    </div>

    <script>
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbyITfWo8NgVpJt0ILAwk8eLhse7mC-pOaDf5lTjQTI2iBUF2OiQcH7dcN7HNsWAVzWe/exec";

      // Padrón de personal por sucursal. La clave es el value de la opción
      // en el <select id="storeName">. Edita SOLO este bloque para actualizarlo.
      const SUCURSALES = {
        "EEP el paraiso": [
          { nombre: "Joberland Suniaga", turno: "PM", cargo: "Supervisor" },
        ],
        "LIN la india": [
          { nombre: "Alejandro Delgado", turno: "AM", cargo: "Supervisor" },
        ],
      };

      const storeNameEl = document.getElementById("storeName");
      const fullNameEl = document.getElementById("fullName");
      const fullNameManualEl = document.getElementById("fullNameManual");
      const manualToggleEl = document.getElementById("manualNameToggle");
      const rosterHintEl = document.getElementById("rosterHint");
      const shiftEl = document.getElementById("workerShift");
      const roleEl = document.getElementById("workerRole");

      // Pone la fecha de hoy por defecto
      document.getElementById("date").valueAsDate = new Date();

      function findSucursalKey(value) {
        const target = String(value || "")
          .trim()
          .toLowerCase();
        if (!target) return null;
        return (
          Object.keys(SUCURSALES).find(
            (key) => key.trim().toLowerCase() === target,
          ) || null
        );
      }

      function storeWorkers() {
        const key = findSucursalKey(storeNameEl.value);
        if (!key) return [];
        return SUCURSALES[key].map((w) => ({
          fullName: String(w.nombre || "").trim(),
          workerShift: String(w.turno || "")
            .trim()
            .toUpperCase(),
          workerRole: String(w.cargo || "")
            .trim()
            .toLowerCase(),
        }));
      }

      function addOption(select, value, text) {
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = text;
        select.appendChild(opt);
      }

      function renderWorkersByStore() {
        if (manualToggleEl.checked) {
          fullNameEl.innerHTML = "";
          fullNameEl.hidden = true;
          fullNameEl.disabled = true;
          fullNameEl.required = false;
          fullNameManualEl.hidden = false;
          fullNameManualEl.required = true;
          shiftEl.disabled = false;
          roleEl.disabled = false;
          rosterHintEl.textContent = "Escribe tu nombre y apellido.";
          return;
        }

        fullNameManualEl.hidden = true;
        fullNameManualEl.required = false;
        fullNameEl.hidden = false;
        fullNameEl.innerHTML = "";
        shiftEl.disabled = true;
        roleEl.disabled = true;

        const store = storeNameEl.value;

        if (!store) {
          addOption(fullNameEl, "", "Selecciona primero tu sucursal...");
          fullNameEl.disabled = true;
          rosterHintEl.textContent = "Elige la sucursal para ver su personal.";
          return;
        }

        const list = storeWorkers();

        if (list.length === 0) {
          addOption(fullNameEl, "", "No hay personal cargado en esta sucursal");
          fullNameEl.disabled = true;
          rosterHintEl.textContent = "Padrón sin registros para " + store + ".";
          return;
        }

        addOption(fullNameEl, "", "Selecciona tu nombre...");
        list.forEach((w) => addOption(fullNameEl, w.fullName, w.fullName));
        fullNameEl.disabled = false;
        rosterHintEl.textContent =
          list.length === 1
            ? "1 trabajador en esta sucursal."
            : list.length + " trabajadores en esta sucursal.";
      }

      function autofillWorkerData() {
        const worker = storeWorkers().find(
          (w) => w.fullName === fullNameEl.value,
        );
        if (!worker) return;

        if (worker.workerShift === "AM" || worker.workerShift === "PM") {
          shiftEl.value = worker.workerShift;
        }
        if (["supervisor", "multifuncional"].includes(worker.workerRole)) {
          roleEl.value = worker.workerRole;
        }
      }

      storeNameEl.addEventListener("change", renderWorkersByStore);
      fullNameEl.addEventListener("change", autofillWorkerData);
      manualToggleEl.addEventListener("change", renderWorkersByStore);
      renderWorkersByStore();

      // "Libre" no se puede combinar con una actividad realizada
      const LIBRE_VALUE = "libre";
      const activityBoxes = Array.from(
        document.querySelectorAll('input[name="act"]'),
      );

      activityBoxes.forEach((box) => {
        box.addEventListener("change", () => {
          if (!box.checked) return;
          activityBoxes.forEach((other) => {
            if (other === box) return;
            if (box.value === LIBRE_VALUE || other.value === LIBRE_VALUE) {
              other.checked = false;
            }
          });
        });
      });

      document
        .getElementById("workerForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const fullName = (
            manualToggleEl.checked ? fullNameManualEl.value : fullNameEl.value
          ).trim();
          const selectedActivities = Array.from(
            document.querySelectorAll('input[name="act"]:checked'),
          ).map((cb) => cb.value);

          if (!fullName) {
            alert("Selecciona tu nombre o escribe el tuyo manualmente.");
            return;
          }
          if (selectedActivities.length === 0) {
            alert("Selecciona al menos una actividad realizada.");
            return;
          }

          const btn = document.getElementById("submitBtn");
          btn.textContent = "Enviando...";
          btn.disabled = true;

          const formData = {
            date: document.getElementById("date").value,
            storeName: storeNameEl.value,
            fullName: fullName,
            workerShift: shiftEl.value,
            workerRole: roleEl.value,
            attendanceStatus: selectedActivities.join(", "),
          };

          try {
            await fetch(SCRIPT_URL, {
              method: "POST",
              mode: "no-cors", // Evita problemas de CORS con Google Apps Script
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(formData),
            });

            document.getElementById("successMsg").style.display = "block";
            document.getElementById("workerForm").reset();
            document.getElementById("date").valueAsDate = new Date(); // Restablece la fecha actual
            renderWorkersByStore();

            setTimeout(() => {
              document.getElementById("successMsg").style.display = "none";
            }, 4000);
          } catch (error) {
            console.error(error);
            alert("Hubo un error al enviar el reporte. Verifica tu conexión.");
          } finally {
            btn.textContent = "Enviar mi Reporte";
            btn.disabled = false;
          }
        });
    </script>
  </body>
</html>
