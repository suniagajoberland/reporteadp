<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Control - Red de Sucursales EEP</title>
    <style>
      :root {
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8;
        --whatsapp-color: #16a34a;
        --whatsapp-hover: #15803d;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-color: #1e293b;
        --border-color: #cbd5e1;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 850px;
        margin: 0 auto;
        background: var(--card-bg);
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }
      h2 {
        margin-top: 0;
        color: var(--primary-color);
        text-align: center;
        font-size: 1.5rem;
        margin-bottom: 5px;
      }
      .company-subtitle {
        text-align: center;
        font-size: 0.85rem;
        color: #64748b;
        margin-bottom: 25px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
        font-size: 0.9rem;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 0.95rem;
        box-sizing: border-box;
        background-color: #fff;
      }
      fieldset {
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
        background-color: #f8fafc;
      }
      legend {
        font-weight: bold;
        color: var(--primary-color);
        padding: 0 10px;
      }
      .btn-sync {
        background-color: #0284c7;
        width: 100%;
        padding: 12px;
        font-size: 1rem;
        margin-bottom: 15px;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      .btn-sync:hover {
        background-color: #0369a1;
      }
      .btn-whatsapp {
        background-color: var(--whatsapp-color);
        color: white;
        border: none;
        padding: 14px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 700;
        font-size: 1.05rem;
        width: 100%;
        margin-top: 10px;
      }
      .btn-whatsapp:hover {
        background-color: var(--whatsapp-hover);
      }
      .worker-card {
        background: white;
        border: 1px solid var(--border-color);
        padding: 12px 15px;
        border-radius: 6px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .worker-info h4 {
        margin: 0 0 3px 0;
        color: #0f172a;
        font-size: 0.95rem;
      }
      .worker-info p {
        margin: 0;
        font-size: 0.85rem;
        color: #475569;
      }
      textarea.output-box {
        width: 100%;
        height: 250px;
        font-family: monospace;
        background-color: #f1f5f9;
        resize: vertical;
        white-space: pre;
      }
      .success-msg {
        color: #16a34a;
        font-weight: 600;
        font-size: 0.85rem;
        margin-top: 5px;
        display: none;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Panel de Control - Red de Sucursales EEP</h2>
      <div class="company-subtitle">Generador de Cierre de Jornada Laboral</div>

      <div class="form-row">
        <div class="form-group">
          <label for="reportDate">Fecha del Día:</label>
          <input type="date" id="reportDate" />
        </div>
        <div class="form-group">
          <label for="storeSelect">Seleccionar Sucursal:</label>
          <select id="storeSelect">
            <option value="EEP el paraiso">EEP</option>
            <option value="LIN la india">LIN</option>
            <!-- Agrega aquí el resto de tus 47 sucursales -->
          </select>
        </div>
      </div>

      <button
        type="button"
        class="btn-sync"
        id="syncBtn"
        onclick="syncWorkerReports()"
      >
        📥 Sincronizar Reportes de esta Sucursal
      </button>

      <div class="form-group">
        <label>Personal Registrado en la Nube (Tienda Seleccionada):</label>
        <div id="workersList" style="margin-bottom: 15px">
          <p
            style="color: #64748b; font-style: italic; font-size: 0.9rem"
            id="emptyMsg"
          >
            Selecciona la sucursal, fecha y haz clic en sincronizar.
          </p>
        </div>
      </div>

      <fieldset>
        <legend>Métricas y Novedades (Autocalculadas)</legend>
        <div class="form-row">
          <div class="form-group">
            <label>Presentes:</label
            ><input type="number" id="cPresentes" value="0" min="0" />
          </div>
          <div class="form-group">
            <label>Libres:</label
            ><input type="number" id="cLibres" value="0" min="0" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Ausentes:</label
            ><input type="number" id="cAusentes" value="0" min="0" />
          </div>
          <div class="form-group">
            <label>Ingresos:</label
            ><input type="number" id="cIngresos" value="0" min="0" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Vacante:</label
            ><input type="number" id="cVacante" value="0" min="0" />
          </div>
          <div class="form-group">
            <label>Egresos:</label
            ><input type="number" id="cEgresos" value="0" min="0" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Vales:</label
            ><input type="number" id="cVales" value="0" min="0" />
          </div>
          <div class="form-group">
            <label for="novedadesText">Novedades:</label>
            <input
              type="text"
              id="novedadesText"
              placeholder="Escriba novedades si las hay..."
            />
          </div>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="finalOutput">Vista Previa del Mensaje:</label>
        <textarea id="finalOutput" class="output-box" readonly></textarea>
      </div>

      <button type="button" class="btn-whatsapp" onclick="sendToWhatsApp()">
        🚀 Enviar a WhatsApp
      </button>
      <div id="copySuccess" class="success-msg">
        ¡Redirigiendo a WhatsApp con éxito!
      </div>
    </div>

    <script>
      const SCRIPT_URLS = [
        "https://script.google.com/macros/s/AKfycbyITfWo8NgVpJt0ILAwk8eLhse7mC-pOaDf5lTjQTI2iBUF2OiQcH7dcN7HNsWAVzWe/exec",
        "https://script.google.com/macros/s/AKfycbxyXCgfEkW1UkvVNrRvk7SfJxy2CEjXe9wudvNdxIc99c3qnY3_a2t1-eJGl78jsQ/exec",
      ];

      const SHIFTS = ["am", "pm"];
      const MONTHS = {
        jan: 1,
        feb: 2,
        mar: 3,
        apr: 4,
        may: 5,
        jun: 6,
        jul: 7,
        aug: 8,
        sep: 9,
        oct: 10,
        nov: 11,
        dec: 12,
      };

      let workers = [];
      let cloudData = [];
      let undatedByWorker = new Map();

      // valueAsDate guarda la fecha en UTC, que de noche adelanta un día el
      // input y el filtro deja de encontrar los reportes del día local.
      function todayISO() {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
      }

      document.getElementById("reportDate").value = todayISO();

      // Las hojas devuelven la fecha en formatos distintos (2026-09-28,
      // 2026-09-28T04:00:00.000Z o "Mon Sep 28 2026 00:00:00 GM")
      function normalizeDate(value) {
        if (!value) return "";
        const raw = String(value).trim();
        const pad = (n) => String(n).padStart(2, "0");

        const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;

        // "Mon Sep 28 2026 00:00:00 GM" no lo parsea Date, se lee por partes
        const spelled = raw.match(/^\w{3}\s+(\w{3})\s+(\d{1,2})\s+(\d{4})/);
        if (spelled && MONTHS[spelled[1].toLowerCase()]) {
          return `${spelled[3]}-${pad(MONTHS[spelled[1].toLowerCase()])}-${pad(spelled[2])}`;
        }

        const parsed = new Date(raw);
        if (isNaN(parsed.getTime())) return "";
        return `${parsed.getFullYear()}-${pad(parsed.getMonth() + 1)}-${pad(parsed.getDate())}`;
      }

      // Una de las hojas no tiene columna storeName: los valores llegan
      // corridos una posición y se detectan porque donde debería ir el cargo
      // aparece el turno (AM/PM).
      function normalizeRecord(record) {
        const role = String(record.workerRole || "")
          .trim()
          .toLowerCase();
        const shifted = !record.storeName && SHIFTS.includes(role);

        const source = shifted
          ? {
              date: record.date,
              storeName: record.fullName,
              fullName: record.workerShift,
              workerShift: record.workerRole,
              workerRole: record.attendanceStatus,
              attendanceStatus: "",
            }
          : record;

        return {
          date: normalizeDate(source.date),
          storeName: String(source.storeName || "").trim(),
          fullName: String(source.fullName || "").trim(),
          workerShift: String(source.workerShift || "")
            .trim()
            .toUpperCase(),
          workerRole: String(source.workerRole || "")
            .trim()
            .toLowerCase(),
          attendanceStatus: String(source.attendanceStatus || "").trim(),
        };
      }

      // Una hoja trae la fecha y la otra trae la actividad. Como la segunda no
      // dice a qué día corresponde cada fila, se separa por fecha: los reportes
      // con fecha van a cloudData y los que solo traen actividad quedan a la
      // espera, para cruzarlos con el día que se está viendo.
      function recordKey(w) {
        return [
          w.storeName.toLowerCase(),
          w.fullName.toLowerCase(),
          w.workerShift,
        ].join("|");
      }

      function fillMissing(base, extra) {
        return {
          date: base.date || extra.date,
          storeName: base.storeName || extra.storeName,
          fullName: base.fullName || extra.fullName,
          workerShift: base.workerShift || extra.workerShift,
          workerRole: base.workerRole || extra.workerRole,
          attendanceStatus: base.attendanceStatus || extra.attendanceStatus,
        };
      }

      function mergeReports(records) {
        const dated = new Map();
        const undated = new Map();

        records.forEach((w) => {
          const key = recordKey(w);
          const target = w.date ? dated : undated;
          const id = w.date ? `${key}|${w.date}` : key;
          const previous = target.get(id);
          target.set(id, previous ? fillMissing(previous, w) : w);
        });

        return {
          dated: Array.from(dated.values()),
          undated: Array.from(undated.values()),
        };
      }

      // Le anexa al reporte del día la actividad que venía en la hoja sin fecha
      function applyPendingActivity(list) {
        list.forEach((w) => {
          if (w.attendanceStatus) return;
          const pending = undatedByWorker.get(recordKey(w));
          if (pending) w.attendanceStatus = pending.attendanceStatus;
        });
      }

      function formatActivities(worker) {
        const raw = String(worker.attendanceStatus || "").trim();
        if (!raw) return "Sin actividad";
        return raw
          .split(",")
          .map((a) => a.trim())
          .filter(Boolean)
          .map((a) => a.charAt(0).toUpperCase() + a.slice(1))
          .join(", ");
      }

      // Arma el listado de sucursales con lo que realmente trae la nube
      function refreshStoreOptions() {
        const select = document.getElementById("storeSelect");
        const current = select.value;
        const stores = Array.from(
          new Set(
            cloudData
              .concat(Array.from(undatedByWorker.values()))
              .map((w) => w.storeName)
              .filter(Boolean),
          ),
        ).sort((a, b) => a.localeCompare(b, "es"));

        if (stores.length === 0) return;

        select.innerHTML = "";
        stores.forEach((name) => {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          select.appendChild(option);
        });

        const stillExists = stores.some(
          (name) => name.toLowerCase() === current.toLowerCase(),
        );
        if (stillExists) select.value = current;
      }

      // Aplica el filtro de fecha y sucursal sobre los datos descargados
      function applyFilters() {
        const selectedDate = document.getElementById("reportDate").value;
        const selectedStore = document
          .getElementById("storeSelect")
          .value.trim()
          .toLowerCase();

        workers = cloudData.filter((w) => {
          if (!w.date || !w.storeName) return false;

          const matchDate = w.date === selectedDate;
          const matchStore =
            w.storeName.toLowerCase() === selectedStore ||
            w.storeName.toLowerCase().includes(selectedStore) ||
            selectedStore.includes(w.storeName.toLowerCase());

          return matchDate && matchStore;
        });

        applyPendingActivity(workers);
        updateUI();
      }

      async function fetchAllReports() {
        const sources = await Promise.all(
          SCRIPT_URLS.map(async (url) => {
            try {
              const response = await fetch(url);
              const data = await response.json();
              return { ok: true, rows: Array.isArray(data) ? data : [] };
            } catch (error) {
              console.warn("No se pudo leer " + url, error);
              return { ok: false, rows: [] };
            }
          }),
        );

        return {
          connected: sources.some((s) => s.ok),
          records: mergeReports(
            sources.flatMap((s) => s.rows).map(normalizeRecord),
          ),
        };
      }

      async function syncWorkerReports() {
        const btn = document.getElementById("syncBtn");
        btn.textContent = "Sincronizando con la nube...";
        btn.disabled = true;

        try {
          const { connected, records } = await fetchAllReports();
          if (!connected) throw new Error("ninguna hoja respondió");
          cloudData = records.dated;
          undatedByWorker = new Map(
            records.undated.map((w) => [recordKey(w), w]),
          );
          refreshStoreOptions();
          applyFilters();
        } catch (error) {
          console.error(error);
          alert(
            "No se pudieron sincronizar los datos. Revisa tu conexión o la URL del script.",
          );
        } finally {
          btn.textContent = "📥 Sincronizar Reportes de esta Sucursal";
          btn.disabled = false;
        }
      }

      function updateUI() {
        const listContainer = document.getElementById("workersList");
        listContainer.innerHTML = "";

        if (workers.length === 0) {
          const emptyText =
            cloudData.length === 0
              ? "Haz clic en sincronizar para descargar los reportes de la nube."
              : "No hay reportes para esta sucursal y fecha en la nube todavía.";
          listContainer.innerHTML = `<p style="color: #64748b; font-style: italic; font-size: 0.9rem;" id="emptyMsg">${emptyText}</p>`;
          document.getElementById("cPresentes").value = 0;
          document.getElementById("cLibres").value = 0;
          generateFinalMessage();
          return;
        }

        let totalPresentes = 0;
        let totalLibres = 0;

        workers.forEach((w) => {
          const estado = (w.attendanceStatus || "").toLowerCase();
          if (estado.includes("libre")) {
            totalLibres++;
          } else {
            totalPresentes++;
          }
        });

        document.getElementById("cPresentes").value = totalPresentes;
        document.getElementById("cLibres").value = totalLibres;

        workers.forEach((w) => {
          const card = document.createElement("div");
          card.className = "worker-card";
          card.innerHTML = `
                <div class="worker-info">
                    <h4>${w.fullName || "Sin Nombre"} <span style="color: var(--primary-color);">[Turno ${w.workerShift || "N/A"}]</span></h4>
                    <p><strong>Cargo:</strong> ${w.workerRole === "supervisor" ? "Supervisor" : "Multifuncional"} | <strong>Actividad:</strong> ${formatActivities(w)}</p>
                </div>
            `;
          listContainer.appendChild(card);
        });

        generateFinalMessage();
      }

      function shiftRoster(shift) {
        const list = workers.filter(
          (w) => (w.workerShift || "").toUpperCase() === shift,
        );
        if (list.length === 0) return "*(Sin personal registrado)*\n\n";
        return list
          .map((w) => {
            const role = w.workerRole === "supervisor" ? "*supervisor* " : "";
            return `${role}${w.fullName}: ${formatActivities(w)}\n\n`;
          })
          .join("");
      }

      function generateFinalMessage() {
        const dateVal = document.getElementById("reportDate").value;
        let formattedDate = dateVal;
        if (dateVal) {
          const parts = dateVal.split("-");
          if (parts.length === 3) {
            formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
          }
        }

        const store =
          document.getElementById("storeSelect").value.trim() || "EEP";
        const presentes = document.getElementById("cPresentes").value;
        const libres = document.getElementById("cLibres").value;
        const ausentes = document.getElementById("cAusentes").value;
        const ingresos = document.getElementById("cIngresos").value;
        const vacante = document.getElementById("cVacante").value;
        const egresos = document.getElementById("cEgresos").value;
        const vales = document.getElementById("cVales").value;
        const novedades = document.getElementById("novedadesText").value.trim();

        let message = `Buenas noches, Fin de la jornada laboral\n`;
        message += `Tienda:  *${store}*\n\n`;
        message += `Día:  ${formattedDate}\n\n`;

        message += `*Turno AM*  6:30 AM a 3:30 PM\n\n`;
        message += shiftRoster("AM");

        message += `*Turno PM*  12:30 PM a 9:30 PM\n\n`;
        message += shiftRoster("PM");

        message += `Presentes: ${presentes}\n`;
        message += `Libres: ${libres}\n`;
        message += `Ausentes: ${ausentes}\n`;
        message += `Ingresos: ${ingresos}\n`;
        message += `Vacante: ${vacante}\n`;
        message += `Egresos: ${egresos}\n`;
        message += `Vales: ${vales}\n`;
        message += `Novedades:  ${novedades}\n\n`;
        message += `Feliz Noche para Tod@s !!`;

        document.getElementById("finalOutput").value = message;
      }

      // La sucursal y la fecha vuelven a filtrar los datos descargados
      ["reportDate", "storeSelect"].forEach((id) => {
        document.getElementById(id).addEventListener("change", applyFilters);
      });

      [
        "cPresentes",
        "cLibres",
        "cAusentes",
        "cIngresos",
        "cVacante",
        "cEgresos",
        "cVales",
        "novedadesText",
      ].forEach((id) => {
        document
          .getElementById(id)
          .addEventListener("input", generateFinalMessage);
        document
          .getElementById(id)
          .addEventListener("change", generateFinalMessage);
      });

      function sendToWhatsApp() {
        const outputBox = document.getElementById("finalOutput");
        const messageText = outputBox.value.trim();

        if (messageText === "") {
          alert("No hay información en el reporte para enviar.");
          return;
        }

        navigator.clipboard.writeText(messageText).then(() => {
          const encodedMessage = encodeURIComponent(messageText);
          const whatsappUrl = `https://api.whatsapp.com/send?text=${encodedMessage}`;
          window.open(whatsappUrl, "_blank");

          const successMsg = document.getElementById("copySuccess");
          successMsg.style.display = "block";
          setTimeout(() => {
            successMsg.style.display = "none";
          }, 3500);

          // Limpia los datos locales de la interfaz una vez enviado
          workers = [];
          cloudData = [];
          undatedByWorker = new Map();
          document.getElementById("cAusentes").value = 0;
          document.getElementById("cIngresos").value = 0;
          document.getElementById("cVacante").value = 0;
          document.getElementById("cEgresos").value = 0;
          document.getElementById("cVales").value = 0;
          document.getElementById("novedadesText").value = "";
          updateUI();
        });
      }
    </script>
  </body>
</html>
